<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kerarty — играбельное резюме · IDA TECH</title>
<meta name="description" content="Интерактивное резюме геймдизайнера: домашний экран с мини-играми. Под вакансию Game Designer (Casual/Hyper Casual) в IDA TECH.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="phone">

  <!-- ДОМАШНИЙ ЭКРАН -->
  <div class="screen" id="scr-home">
    <div class="statusbar">
      <span id="clock">--:--</span>
      <span class="island" aria-hidden="true"></span>
      <span class="battery" title="заряд кандидата"><span class="battery-icon"></span>100%</span>
    </div>

    <div class="profile">
      <div class="avatar" aria-hidden="true">K</div>
      <div class="profile-info">
        <div class="profile-name"></div>
        <div class="profile-role"></div>
        <div class="profile-note"></div>
      </div>
    </div>

    <div class="apps" id="apps"></div>

    <div class="dock" id="dock"></div>
    <div class="hint">Каждое приложение — часть резюме. Внутри — мини-игры.</div>
  </div>

  <!-- ЭКРАН МИНИ-ИГРЫ -->
  <div class="screen layer" id="scr-game">
    <header class="layer-head">
      <button class="back" id="game-back" aria-label="назад"></button>
      <div class="layer-title" id="game-title"></div>
      <button class="inspector" id="game-inspect" title="дизайн-комментарий" aria-label="дизайн-комментарий"></button>
    </header>
    <div class="layer-body" id="game-body"></div>
    <aside class="note" id="game-note" hidden></aside>
  </div>

  <!-- ЭКРАН РАЗДЕЛА РЕЗЮМЕ («отчёт») -->
  <div class="screen layer" id="scr-section">
    <header class="layer-head">
      <button class="back" id="section-back" aria-label="назад"></button>
      <div class="layer-title" id="section-title"></div>
      <span class="head-spacer"></span>
    </header>
    <div class="layer-body" id="section-body"></div>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/games.js"></script>
<script src="js/games/memory.js"></script>
<script src="js/games/logic.js"></script>
<script src="js/games/reaction.js"></script>
<script src="js/games/ablab.js"></script>
<script src="js/sections.js"></script>
<script src="js/app.js"></script>
</body>
</html>
